[project]
name = "emt-pipeline"
version = "0.1.0"
description = "Analysis and reporting for EMT force recordings from 24-well plates"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Pinned to the minor versions the analyses were validated with. Upgrade
# deliberately (uv lock --upgrade-package ...) and re-check the outputs.
dependencies = [
    "numpy>=1.26,<2",
    "openpyxl>=3.1,<3.2",
    "pandas>=2.2,<2.3",
    "quarto-cli",        # bundles the Quarto binary used to render the R reports
    "tqdm>=4.66",
]

[tool.uv]
package = false

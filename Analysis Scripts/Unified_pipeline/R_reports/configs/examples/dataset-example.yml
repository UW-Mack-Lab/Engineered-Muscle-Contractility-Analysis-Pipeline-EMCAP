# Example dataset (multi-batch) EMT report config.
# Copy it up a level to use it -- dataset configs in configs/ are personal and
# git-ignored, and the launcher lists every configs/*.yml as a dataset:
#   cp configs/examples/dataset-example.yml configs/mydataset.yml
#   cp configs/examples/example-batches.csv configs/mydataset-batches.csv
# Paths are relative to R_reports/ (where emt-report.qmd lives).

name: My Dataset
# One row per batch x analysis: batch, analysis (ff/75hz/fatigue), directory
# (folder holding that analysis's .xlsx workbooks), exclude (1 = skip); plus a
# `timeforce` row per batch (raw folder, optional plate_map) for the combined
# plate report. The launcher's "Register in dataset" adds these rows for you.
batch_csv: configs/mydataset-batches.csv
output_dir: output/mydataset

# Display label -> raw labels found in the workbooks (clone names etc.).
# The order here is the plotting/legend order; the first one is the
# reference condition for statistics.
conditions:
  WT:       [UC2WT, WT]          # list every spelling used across batches
  R672CHet: [HetR672C]
  R672CHom: [HomR672C]

colors:
  WT:       "#000000"
  R672CHet: "#009E73"
  R672CHom: "#E69F00"

labels:
  condition: Genotype
  batch: Differentiation

days_max: 7

# Panels A/B (and fatigue curves) show the condition-average trace of these batches
trace_batches: [1]
# Metric panels, sweep and stats. `all` = every non-excluded batch in the CSV.
metric_batches: all

kinetics:
  stim_time_s: 48     # 75 Hz stim used for panels A/B (stims at 48, 93, 139 s)
  window_s: 3
  baseline_s: 0.01    # baseline = mean force over (stim, stim + baseline_s]

# Panels C-F: sheet metric name -> y-axis label
kinetics_metrics:
  "Max tetanic-BK (μN)": "Active Force (μN)"
  "TT50P Time": "Time to 50% Peak (s)"
  "R50 Time": "Time to 50% Relax (s)"
  "TTP90 Time": "Time to 90% Peak (s)"

# Panel G
ff_metric:
  name: "FF Normalized (%)"
  label: "Percent of 100Hz Tension (%)"

# Fatigue summary metrics to show as panels
fatigue_metrics:
  "Fatigue Resistance Index (%)": "Fatigue Resistance Index (%)"
  "Last Normalized Force (% of T1)": "Final Force (% of first)"

stats:
  unit: batch        # batch = average wells within each batch first; well = pseudo-replicated
  paired: false      # true = paired t-test across batches (each batch has every condition)
  p_adjust: BH       # any p.adjust method; applied within each metric

# Combined plate trace report (launcher: Dataset reports -> Combined plate trace
# report). Uses the batch CSV's `timeforce` rows. Optional overrides of the plate
# settings (MANUAL §10.3), e.g.:
# plates:
#   days: [3, 4, 5, 6, 7]
#   png_dpi: 150

sweep: true          # superplot every metric in every analysis
seed: 1

panel_sizes:         # width, height in inches
  traces:  [10, 2.5]
  metric:  [4, 4]
  ff:      [14, 3.5]
  fatigue: [10, 2.5]
  sweep:   [8, 6]
